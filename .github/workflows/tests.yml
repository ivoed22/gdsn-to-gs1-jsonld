name: Tests

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[dev]"
      - run: pytest

      - name: Compile all sources
        run: python -m compileall app src

      - name: CLI smoke — Product Passport source inventory
        run: >-
          gdsn-to-gs1-jsonld inventory-product-passport-sources
          --manifest product_passport/reference_sources/source_manifest.json
          --output-dir /tmp/product_passport_inventory

      - name: CLI smoke — Product Passport structural validation
        run: >-
          gdsn-to-gs1-jsonld validate-product-passport
          --input product_passport/examples/minimal_product_passport.json
          --schema product_passport/reference_sources/raw_public/schemas/dpp_minimal.schema.json
          --manifest product_passport/reference_sources/source_manifest.json
          --output-dir /tmp/product_passport_validation

      - name: CLI smoke — Mapping registry quality check
        run: >-
          gdsn-to-gs1-jsonld check-mapping
          --mapping mapping/mapping_registry.yaml
          --catalog mapping_catalog/gdsn_to_gs1_web_vocabulary_mapping_catalog_v0_3_webvoc_validated.csv

      - name: CLI smoke — Mapping candidate generation
        run: >-
          gdsn-to-gs1-jsonld generate-mapping-candidates
          --property gs1:gtin
          --webvoc-properties reference_data/normalized/webvoc_properties_1_17.csv
          --gdsn-reference reference_data/normalized/gdsn_attributes_bms_xpath_3_1_36.csv
          --catalog mapping_catalog/gdsn_to_gs1_web_vocabulary_mapping_catalog_v0_3_webvoc_validated.csv
          --mapping mapping/mapping_registry.yaml
          --standards-backlog docs/standards-decisions/standards_review_backlog.json
          --output-dir /tmp/mapping_candidate_gtin

      - name: CLI smoke — Product Passport Builder
        run: >-
          gdsn-to-gs1-jsonld build-product-passport
          --input product_passport/examples/gs1_product_for_passport_builder.jsonld
          --schema product_passport/reference_sources/raw_public/schemas/dpp_minimal.schema.json
          --output-dir /tmp/product_passport_builder

  visual-smoke:
    # Browser-based smoke (v0.17.0): catches CSS/layout regressions the
    # AppTest harness above cannot see. Non-blocking until stable — see
    # docs/visual-smoke.md. No app behavior changes; read-only browsing.
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -e ".[visual]"
      - run: playwright install --with-deps chromium

      - name: Run visual smoke
        run: python scripts/visual_smoke.py --output-dir tests/visual/baselines

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke-screenshots
          path: tests/visual/baselines/
          if-no-files-found: ignore
