metadata:
  name: GDSN to GS1 JSON-LD Clean Product Profile
  version: 0.6.0
  description: Clean product output with explicit GS1 code IRIs, typed nested country/contact
    objects and referenced-file type metadata.
  derived_from: mapping/mapping_v0_5.yaml
  webvoc_snapshot: webvoc/current/gs1Voc.jsonld
settings:
  namespace_strategy: local-name
  default_language: en
  # gs1:ingredientStatement (and other food properties this profile emits) have
  # gs1:FoodBeverageTobaccoProduct as their domain, so declare that subclass
  # explicitly rather than relying on RDFS inference by the consumer.
  root_type: gs1:FoodBeverageTobaccoProduct
  jsonld_context:
  - https://ref.gs1.org/voc/data/gs1Voc.jsonld
  - schema: https://schema.org/
    xsd: http://www.w3.org/2001/XMLSchema#
fields:
- id: gtin
  description: Global Trade Item Number
  xpath: .//*[local-name()='gtin']
  value_xpath: text()
  canonical_field: gtin
  jsonld_property: gs1:gtin
  required: true
  datatype: string
  multiple: false
  transform:
  - trim
  - validate_gtin
- id: product_name
  description: Multilingual product name
  xpath: .//*[local-name()='tradeItemDescription']
  value_xpath: text()
  language_xpath: ./@languageCode
  canonical_field: product_name
  jsonld_property: gs1:productName
  required: true
  datatype: language_string
  multiple: true
  fallback_language: en
  transform:
  - trim
  - normalize_whitespace
- id: product_description
  description: Multilingual short product description
  xpath: .//*[local-name()='descriptionShort']
  value_xpath: text()
  language_xpath: ./@languageCode
  canonical_field: product_description
  jsonld_property: gs1:productDescription
  required: false
  datatype: language_string
  multiple: true
  fallback_language: en
  transform:
  - trim
  - normalize_whitespace
- id: gpc_category_code
  description: GS1 Global Product Classification category code
  xpath: .//*[local-name()='gpcCategoryCode']
  value_xpath: text()
  canonical_field: gpc_category_code
  jsonld_property: gs1:gpcCategoryCode
  required: false
  datatype: string
  multiple: false
  transform:
  - trim
- id: net_content_value
  description: Numeric net content value
  xpath: .//*[local-name()='netContent']/*[local-name()='measurementValue']
  value_xpath: text()
  canonical_field: net_content_value
  jsonld_property: gs1:netContent
  required: false
  datatype: decimal
  multiple: false
  transform:
  - trim
  - to_decimal
- id: net_content_unit
  description: Net content measurement unit code
  xpath: .//*[local-name()='netContent']/*[local-name()='measurementUnitCode']
  value_xpath: text()
  canonical_field: net_content_unit
  jsonld_property: gs1:netContent
  required: false
  datatype: string
  multiple: false
  transform:
  - trim
  - uppercase
- id: product_image_url
  description: Product image URL
  xpath: .//*[local-name()='referencedFileInformation'][.//*[local-name()='referencedFileTypeCode'
    and normalize-space(text())='PRODUCT_IMAGE']]/*[local-name()='uniformResourceIdentifier']
  value_xpath: text()
  canonical_field: product_image_url
  jsonld_property: gs1:productImage
  required: false
  datatype: url
  multiple: true
  transform:
  - trim
  - validate_url
- id: product_page_url
  description: Product marketing page URL
  xpath: .//*[local-name()='marketingInformation']/*[local-name()='uniformResourceIdentifier']
  value_xpath: text()
  canonical_field: product_page_url
  jsonld_property: schema:url
  required: false
  datatype: url
  multiple: false
  transform:
  - trim
  - validate_url
- id: ingredient_statement
  description: Multilingual ingredient statement
  xpath: .//*[local-name()='ingredientStatement'][@languageCode]
  value_xpath: text()
  language_xpath: ./@languageCode
  canonical_field: ingredient_statement
  jsonld_property: gs1:ingredientStatement
  required: false
  datatype: language_string
  multiple: true
  fallback_language: en
  transform:
  - trim
  - normalize_whitespace
- id: functional_name
  description: Functional name
  xpath: .//*[local-name()='functionalName']
  value_xpath: text()
  canonical_field: functional_name
  jsonld_property: gs1:functionalName
  required: false
  datatype: language_string
  multiple: true
  transform:
  - trim
  - normalize_whitespace
  language_xpath: ./@languageCode
  fallback_language: und
- id: regulated_product_name
  description: Regulated product name
  xpath: .//*[local-name()='regulatedProductName']
  value_xpath: text()
  canonical_field: regulated_product_name
  jsonld_property: gs1:regulatedProductName
  required: false
  datatype: language_string
  multiple: true
  transform:
  - trim
  - normalize_whitespace
  language_xpath: ./@languageCode
  fallback_language: und
- id: gpc_category_description
  description: GPC category description
  xpath: .//*[local-name()='gpcCategoryName']
  value_xpath: text()
  canonical_field: gpc_category_description
  jsonld_property: gs1:gpcCategoryDescription
  required: false
  datatype: language_string
  multiple: true
  transform:
  - trim
  - normalize_whitespace
  language_xpath: ./@languageCode
  fallback_language: und
object_mappings:
- id: allergens
  description: Allergen details
  parent_xpath: .//*[local-name()='allergenRelatedInformation']/*[local-name()='allergen']
  canonical_field: allergens
  jsonld_property: gs1:hasAllergen
  object_type: gs1:AllergenDetails
  multiple: true
  fields:
  - id: allergen_type
    xpath: ./*[local-name()='allergenTypeCode']
    value_xpath: text()
    canonical_field: allergen_type
    jsonld_property: gs1:allergenType
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
    code_prefix: gs1:AllergenTypeCode-
  - id: level_of_containment
    xpath: ./*[local-name()='levelOfContainmentCode']
    value_xpath: text()
    canonical_field: level_of_containment
    jsonld_property: gs1:allergenLevelOfContainmentCode
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
    code_prefix: gs1:LevelOfContainmentCode-
- id: certifications
  description: BMS-aligned certification details
  parent_xpath: .//*[local-name()='certificationInformation']/*[local-name()='certification']
  canonical_field: certifications
  jsonld_property: gs1:certification
  object_type: gs1:CertificationDetails
  multiple: true
  fields:
  - id: certification_standard
    xpath: ancestor::*[local-name()='certificationInformation'][1]/*[local-name()='certificationStandard']
    value_xpath: text()
    canonical_field: certification_standard
    jsonld_property: gs1:certificationStandard
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    - normalize_whitespace
  - id: certification_identification
    xpath: ./*[local-name()='certificationIdentification']
    value_xpath: text()
    canonical_field: certification_identification
    jsonld_property: schema:identifier
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
  - id: certification_value
    xpath: ./*[local-name()='certificationValue']
    value_xpath: text()
    canonical_field: certification_value
    jsonld_property: gs1:certificationValue
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - normalize_whitespace
  - id: certificate_issuance_date_time
    xpath: ./*[local-name()='certificateIssuanceDateTime']
    value_xpath: text()
    canonical_field: certificate_issuance_date_time
    jsonld_property: schema:dateIssued
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
  - id: certification_assessment_date_time
    xpath: ./*[local-name()='certificationAssessmentDateTime']
    value_xpath: text()
    canonical_field: assessment_date
    jsonld_property: gs1:certificationAuditDate
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    - to_date
  - id: certification_effective_start_date_time
    xpath: ./*[local-name()='certificationEffectiveStartDateTime']
    value_xpath: text()
    canonical_field: effective_start
    jsonld_property: gs1:certificationStartDate
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    - to_date
  - id: certification_effective_end_date_time
    xpath: ./*[local-name()='certificationEffectiveEndDateTime']
    value_xpath: text()
    canonical_field: effective_end
    jsonld_property: gs1:certificationEndDate
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    - to_date
  - id: certification_organisation_identifier
    xpath: ancestor::*[local-name()='certificationInformation'][1]/*[local-name()='certificationOrganisationIdentifier']
    value_xpath: text()
    canonical_field: certification_organisation_identifier
    jsonld_property: gs1:certificationAgency
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
- id: referenced_documents
  description: Official referenced-file details
  parent_xpath: .//*[local-name()='referencedFileInformation'][./*[local-name()='referencedFileTypeCode'][normalize-space(text())='DPP_DOCUMENT'
    or normalize-space(text())='CERTIFICATION_DOCUMENT']]
  canonical_field: referenced_documents
  jsonld_property: gs1:referencedFile
  object_type: gs1:ReferencedFileDetails
  multiple: true
  fields:
  - id: document_file_name
    xpath: ./*[local-name()='fileName']
    value_xpath: text()
    canonical_field: file_name
    jsonld_property: schema:name
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
  - id: document_file_format
    xpath: ./*[local-name()='fileFormatName']
    value_xpath: text()
    canonical_field: file_format
    jsonld_property: schema:encodingFormat
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    - uppercase
  - id: document_file_type
    xpath: ./*[local-name()='referencedFileTypeCode']
    value_xpath: text()
    canonical_field: referenced_file_type
    jsonld_property: gs1:referencedFileTypeCode
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
  - id: document_url
    xpath: ./*[local-name()='uniformResourceIdentifier']
    value_xpath: text()
    canonical_field: document_url
    jsonld_property: schema:url
    datatype: url
    required: true
    multiple: false
    transform:
    - trim
    - validate_url
- id: gross_weights
  description: Gross weight with unit
  parent_xpath: .//*[local-name()='grossWeight']
  canonical_field: gross_weights
  jsonld_property: gs1:grossWeight
  object_type: gs1:QuantitativeValue
  multiple: false
  fields:
  - id: gross_weight_value
    xpath: .
    value_xpath: text()
    canonical_field: value
    jsonld_property: gs1:value
    value_datatype: xsd:float
    datatype: decimal
    required: true
    multiple: false
    transform:
    - trim
    - to_decimal
  - id: gross_weight_unit
    xpath: .
    value_xpath: ./@measurementUnitCode
    canonical_field: unit_code
    jsonld_property: gs1:unitCode
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
- id: packaging_details
  description: Packaging details
  parent_xpath: .//*[local-name()='packaging'][./*[local-name()='packagingTypeCode']]
  canonical_field: packaging_details
  jsonld_property: gs1:packaging
  object_type: gs1:PackagingDetails
  multiple: true
  fields:
  - id: packaging_type
    xpath: ./*[local-name()='packagingTypeCode']
    value_xpath: text()
    canonical_field: packaging_type
    jsonld_property: gs1:packagingType
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
- id: brands
  description: Brand as a gs1:Brand node (gs1:brandName's domain is gs1:Brand)
  parent_xpath: .//*[local-name()='brandNameInformation'][./*[local-name()='brandName']]
  canonical_field: brands
  jsonld_property: gs1:brand
  object_type: gs1:Brand
  multiple: false
  fields:
  - id: brand_name_value
    xpath: ./*[local-name()='brandName']
    value_xpath: text()
    canonical_field: brand_name
    jsonld_property: gs1:brandName
    datatype: language_string
    # A brand name is generally not bound to one language; the source carries no
    # languageCode here, so 'und' records that honestly rather than guessing.
    fallback_language: und
    required: true
    multiple: false
    transform:
    - trim
- id: countries_of_origin
  description: Country of origin
  parent_xpath: .//*[local-name()='countryOfOrigin'][./*[local-name()='countryCode']]
  canonical_field: countries_of_origin
  jsonld_property: gs1:countryOfOrigin
  object_type: gs1:Country
  multiple: true
  fields:
  - id: origin_country_code
    xpath: ./*[local-name()='countryCode']
    value_xpath: text()
    canonical_field: country_code
    jsonld_property: gs1:countryCode
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
- id: target_markets
  description: Target market and first availability
  parent_xpath: .//*[local-name()='targetMarket'][./*[local-name()='targetMarketCountryCode']]
  canonical_field: target_markets
  jsonld_property: gs1:targetMarket
  object_type: gs1:TargetMarketDetails
  multiple: true
  fields:
  - id: target_market_country
    xpath: ./*[local-name()='targetMarketCountryCode']
    value_xpath: text()
    canonical_field: country.country_code
    jsonld_property: gs1:targetMarketCountries.gs1:countryCode
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
    nested_object_type: gs1:Country
  - id: first_availability
    xpath: ancestor::*[local-name()='tradeItem'][1]//*[local-name()='startAvailabilityDateTime']
    value_xpath: text()
    canonical_field: first_availability
    jsonld_property: gs1:consumerFirstAvailabilityDateTime
    value_datatype: xsd:dateTime
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
- id: customer_support_centres
  description: Consumer support organization and contact channel
  parent_xpath: .//*[local-name()='tradeItemContactInformation'][./*[local-name()='contactTypeCode'][normalize-space(text())='CXC']]
  canonical_field: customer_support_centres
  jsonld_property: gs1:customerSupportCentre
  object_type: gs1:Organization
  multiple: true
  fields:
  - id: support_party_gln
    xpath: ancestor::*[local-name()='tradeItem'][1]/*[local-name()='informationProviderOfTradeItem']/*[local-name()='gln']
    value_xpath: text()
    canonical_field: party_gln
    jsonld_property: gs1:partyGLN
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
  - id: support_organization_name
    xpath: ancestor::*[local-name()='tradeItem'][1]/*[local-name()='informationProviderOfTradeItem']/*[local-name()='partyName']
    value_xpath: text()
    canonical_field: organization_name
    jsonld_property: gs1:organizationName
    datatype: language_string
    language_xpath: ./@languageCode
    fallback_language: und
    required: false
    multiple: false
    transform:
    - trim
    - normalize_whitespace
  - id: support_contact_name
    xpath: .//*[local-name()='contactName']
    value_xpath: text()
    canonical_field: contact.name
    jsonld_property: gs1:contactPoint.schema:name
    datatype: string
    nested_object_type: gs1:ContactPoint
    required: false
    multiple: false
    transform:
    - trim
    - normalize_whitespace
  - id: support_email
    xpath: .//*[local-name()='communicationChannel'][./*[local-name()='communicationChannelCode'][normalize-space(text())='EMAIL']]/*[local-name()='communicationValue']
    value_xpath: text()
    canonical_field: contact.email
    jsonld_property: gs1:contactPoint.gs1:email
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    nested_object_type: gs1:ContactPoint
- id: product_images
  description: Product image metadata
  parent_xpath: .//*[local-name()='referencedFileHeader'][./*[local-name()='referencedFileTypeCode'][normalize-space(text())='PRODUCT_IMAGE']]
  canonical_field: product_images
  jsonld_property: gs1:image
  object_type: gs1:ReferencedFileDetails
  multiple: true
  fields:
  - id: image_url
    xpath: ./*[local-name()='uniformResourceIdentifier']
    value_xpath: text()
    canonical_field: url
    jsonld_property: gs1:referencedFileURL
    value_datatype: xsd:anyURI
    datatype: url
    required: true
    multiple: false
    transform:
    - trim
    - validate_url
  - id: image_type
    xpath: ./*[local-name()='referencedFileTypeCode']
    value_xpath: text()
    canonical_field: referenced_file_type
    jsonld_property: gs1:referencedFileType
    datatype: string
    code_prefix: gs1:ReferencedFileTypeCode-
    required: false
    multiple: false
    transform:
    - trim
    - uppercase
  - id: image_name
    xpath: ./*[local-name()='fileName']
    value_xpath: text()
    canonical_field: name
    jsonld_property: gs1:referencedFileName
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
  - id: image_pixel_height
    xpath: .//*[local-name()='filePixelHeight']
    value_xpath: text()
    canonical_field: pixel_height
    jsonld_property: gs1:filePixelHeight
    datatype: decimal
    required: false
    multiple: false
    transform:
    - trim
    - to_decimal
  - id: image_pixel_width
    xpath: .//*[local-name()='filePixelWidth']
    value_xpath: text()
    canonical_field: pixel_width
    jsonld_property: gs1:filePixelWidth
    datatype: decimal
    required: false
    multiple: false
    transform:
    - trim
    - to_decimal
candidate_expansion:
  status: review_required
  policy: Only structurally reviewed additions execute. Remaining AI candidates stay
    removable review evidence.
  consensus_source: mapping_catalog/unmapped_gdsn_webvoc_suggestions_v0_1.csv
