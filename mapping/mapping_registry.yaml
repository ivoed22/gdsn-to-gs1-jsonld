    governance:
      status: accepted
      catalog_status: candidate_official_bms_xpath
      confidence: high
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: General URL for referenced file headers. | Schema.org term; not part of GS1 Web
        Vocabulary but acceptable as an external namespace if documented.
      review_action: OK_schema
