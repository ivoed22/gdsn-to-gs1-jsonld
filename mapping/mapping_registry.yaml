# Consolidated mapping registry (generated by scripts/build_mapping_registry.py).
# fields/object_mappings are structurally identical to mapping_v0_3.yaml and are
# the only sections the converter executes; governance and catalog are review
# metadata. Do not edit by hand: changing accepted mappings is a reviewed
# standards decision. Regenerate via the script after any reviewed change.
metadata:
  name: GDSN to GS1 JSON-LD Consolidated Mapping Registry
  version: 0.3.0
  registry_version: 1.0.0
  description: 'Consolidated mapping registry: the executable mapping profile (structurally
    identical to mapping_v0_3.yaml) merged with the governance review catalog. The converter
    executes fields and object_mappings only; governance and catalog entries are review metadata.
    Review-only; not an official GS1 decision.'
  consolidated_from:
  - mapping/mapping_v0_3.yaml
  - mapping_catalog/gdsn_to_gs1_web_vocabulary_mapping_catalog_v0_3_webvoc_validated.csv
  status_vocabulary:
  - proposed
  - review_required
  - accepted
  - rejected
  - deprecated
  - blocked
settings:
  namespace_strategy: local-name
  default_language: en
  jsonld_context:
  - https://ref.gs1.org/voc/data/gs1Voc.jsonld
  - schema: https://schema.org/
fields:
- id: gtin
  description: Global Trade Item Number
  xpath: .//*[local-name()='gtin']
  value_xpath: text()
  canonical_field: gtin
  jsonld_property: gs1:gtin
  required: true
  datatype: string
  multiple: false
  transform:
  - trim
  - validate_gtin
  governance:
    status: accepted
    catalog_status: mapped_official_bms_xpath
    confidence: high
    review_required: false
    source: mapping_catalog v0.3 (webvoc validated)
    notes: Primary trade item GTIN.
    review_action: OK
- id: product_name
  description: Multilingual product name
  xpath: .//*[local-name()='tradeItemDescription']
  value_xpath: text()
  language_xpath: ./@languageCode
  canonical_field: product_name
  jsonld_property: gs1:productName
  required: true
  datatype: language_string
  multiple: true
  fallback_language: en
  transform:
  - trim
  - normalize_whitespace
  governance:
    status: accepted
    catalog_status: mapped_official_bms_xpath
    confidence: high
    review_required: false
    source: mapping_catalog v0.3 (webvoc validated)
    notes: Language support via BMS 3518 tradeItemDescription/@languageCode.
    review_action: OK
- id: product_description
  description: Multilingual short product description
  xpath: .//*[local-name()='descriptionShort']
  value_xpath: text()
  language_xpath: ./@languageCode
  canonical_field: product_description
  jsonld_property: gs1:productDescription
  required: false
  datatype: language_string
  multiple: true
  fallback_language: en
  transform:
  - trim
  - normalize_whitespace
  governance:
    status: accepted
    catalog_status: mapped_official_bms_xpath
    confidence: high
    review_required: false
    source: mapping_catalog v0.3 (webvoc validated)
    notes: Language support via BMS 3507 descriptionShort/@languageCode.
    review_action: OK
- id: brand_name
  description: Product brand name
  xpath: .//*[local-name()='brandName']
  value_xpath: text()
  canonical_field: brand_name
  jsonld_property: gs1:brandName
  required: false
  datatype: string
  multiple: false
  transform:
  - trim
  governance:
    status: accepted
    catalog_status: mapped_official_bms_xpath
    confidence: high
    review_required: false
    source: mapping_catalog v0.3 (webvoc validated)
    notes: Official brand name in tradeItemDescriptionModule.
    review_action: OK
- id: gpc_category_code
  description: GS1 Global Product Classification category code
  xpath: .//*[local-name()='gpcCategoryCode']
  value_xpath: text()
  canonical_field: gpc_category_code
  jsonld_property: gs1:gpcCategoryCode
  required: false
  datatype: string
  multiple: false
  transform:
  - trim
  governance:
    status: accepted
    catalog_status: mapped_official_bms_xpath
    confidence: high
    review_required: false
    source: mapping_catalog v0.3 (webvoc validated)
    notes: GPC category code in GDSNTradeItemClassification.
    review_action: OK
- id: net_content_value
  description: Numeric net content value
  xpath: .//*[local-name()='netContent']/*[local-name()='measurementValue']
  value_xpath: text()
  canonical_field: net_content_value
  jsonld_property: gs1:netContent
  required: false
  datatype: decimal
  multiple: false
  transform:
  - trim
  - to_decimal
  governance:
    status: accepted
    catalog_status: mapped_official_bms_xpath
    confidence: high
    review_required: false
    source: mapping_catalog v0.3 (webvoc validated)
    notes: Measurement value is the element text; unit via BMS 3734 netContent/@measurementUnitcode.
      Note lowercase c in source header.
    review_action: OK
- id: net_content_unit
  description: Net content measurement unit code
  xpath: .//*[local-name()='netContent']/*[local-name()='measurementUnitCode']
  value_xpath: text()
  canonical_field: net_content_unit
  jsonld_property: gs1:netContent
  required: false
  datatype: string
  multiple: false
  transform:
  - trim
  - uppercase
  governance:
    status: accepted
    catalog_status: mapped_official_bms_xpath
    confidence: high
    review_required: false
    source: mapping_catalog v0.3 (webvoc validated)
    notes: Measurement value is the element text; unit via BMS 3734 netContent/@measurementUnitcode.
      Note lowercase c in source header.
    review_action: OK
- id: product_image_url
  description: Product image URL
  xpath: .//*[local-name()='referencedFileInformation'][.//*[local-name()='referencedFileTypeCode'
    and normalize-space(text())='PRODUCT_IMAGE']]/*[local-name()='uniformResourceIdentifier']
  value_xpath: text()
  canonical_field: product_image_url
  jsonld_property: gs1:productImage
  required: false
  datatype: url
  multiple: true
  transform:
  - trim
  - validate_url
  governance:
    status: accepted
    catalog_status: candidate_needs_code_filter_review
    confidence: medium
    review_required: true
    source: mapping_catalog v0.3 (webvoc validated)
    notes: Current v0.1 synthetic sample uses referencedFileInformation. Official candidate
      is referencedFileDetailInformationModule filtered by referencedFileTypeCode; verify
      PRODUCT_IMAGE code use. | gs1:productImage is not present in the supplied GS1 Web Vocabulary.
      Consider schema:image or a GS1 link type/Digital Link relation.
    review_action: review_replace
- id: product_page_url
  description: Product marketing page URL
  xpath: .//*[local-name()='marketingInformation']/*[local-name()='uniformResourceIdentifier']
  value_xpath: text()
  canonical_field: product_page_url
  jsonld_property: schema:url
  required: false
  datatype: url
  multiple: false
  transform:
  - trim
  - validate_url
  governance:
    status: accepted
    catalog_status: needs_bms_review
    confidence: low
    review_required: true
    source: mapping_catalog v0.3 (webvoc validated)
    notes: Current v0.1 synthetic sample uses marketingInformation/uniformResourceIdentifier.
      BMS 3.1.36 should be reviewed for the correct product page / e-content / referenced
      file mechanism. | Schema.org term; not part of GS1 Web Vocabulary but acceptable as
      an external namespace if documented.
    review_action: OK_schema
- id: ingredient_statement
  description: Multilingual ingredient statement
  xpath: .//*[local-name()='ingredientStatement'][@languageCode]
  value_xpath: text()
  language_xpath: ./@languageCode
  canonical_field: ingredient_statement
  jsonld_property: gs1:ingredientStatement
  required: false
  datatype: language_string
  multiple: true
  fallback_language: en
  transform:
  - trim
  - normalize_whitespace
  governance:
    status: accepted
    catalog_status: mapped_official_bms_xpath
    confidence: high
    review_required: false
    source: mapping_catalog v0.3 (webvoc validated)
    notes: Language support via BMS 1269 ingredientStatement/@languageCode.
    review_action: OK
object_mappings:
- id: allergens
  description: Allergen details
  parent_xpath: .//*[local-name()='allergenRelatedInformation']/*[local-name()='allergen']
  canonical_field: allergens
  jsonld_property: gs1:hasAllergen
  object_type: gs1:AllergenDetails
  multiple: true
  fields:
  - id: allergen_type
    xpath: ./*[local-name()='allergenTypeCode']
    value_xpath: text()
    canonical_field: allergen_type
    jsonld_property: gs1:allergenType
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
    governance:
      status: accepted
      catalog_status: mapped_official_bms_xpath
      confidence: high
      review_required: false
      source: mapping_catalog v0.3 (webvoc validated)
      notes: AllergenTypeCode under allergenInformationModule.
      review_action: OK
  - id: level_of_containment
    xpath: ./*[local-name()='levelOfContainmentCode']
    value_xpath: text()
    canonical_field: level_of_containment
    jsonld_property: gs1:levelOfContainment
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
    governance:
      status: accepted
      catalog_status: mapped_official_bms_xpath
      confidence: high
      review_required: false
      source: mapping_catalog v0.3 (webvoc validated)
      notes: LevelOfContainmentCode under allergenInformationModule. | gs1:levelOfContainment
        is not present; gs1:allergenLevelOfContainmentCode exists and has range gs1:LevelOfContainmentCode.
      review_action: review_replace
- id: nutrients
  description: Basic nutrient details
  parent_xpath: .//*[local-name()='nutrientHeader']/*[local-name()='nutrientDetail']
  canonical_field: nutrients
  jsonld_property: gs1:nutrientDetail
  multiple: true
  fields:
  - id: preparation_state_code
    xpath: ancestor::*[local-name()='nutrientHeader'][1]/*[local-name()='preparationStateCode']
    value_xpath: text()
    canonical_field: preparation_state_code
    jsonld_property: gs1:preparationStateCode
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    - uppercase
    governance:
      status: accepted
      catalog_status: mapped_official_bms_xpath
      confidence: high
      review_required: false
      source: mapping_catalog v0.3 (webvoc validated)
      notes: PreparationTypeCode under nutritionalInformationModule. | gs1:preparationStateCode
        is not present; gs1:preparationCode exists in Web Vocabulary.
      review_action: review_replace
  - id: nutrient_type_code
    xpath: ./*[local-name()='nutrientTypeCode']
    value_xpath: text()
    canonical_field: nutrient_type_code
    jsonld_property: gs1:nutrientTypeCode
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
    governance:
      status: accepted
      catalog_status: mapped_official_bms_xpath
      confidence: high
      review_required: false
      source: mapping_catalog v0.3 (webvoc validated)
      notes: NutrientTypeCode under nutrientDetail. | Generic gs1:nutrientDetail, gs1:nutrientTypeCode
        and gs1:quantityContained are not present in the supplied Web Vocabulary. Current
        v0.2 mapping should be treated as experimental.
      review_action: model_review
  - id: quantity_value
    xpath: ./*[local-name()='quantityContained']/*[local-name()='measurementValue']
    value_xpath: text()
    canonical_field: quantity_contained.value
    jsonld_property: gs1:quantityContained.value
    datatype: decimal
    required: true
    multiple: false
    transform:
    - trim
    - to_decimal
    governance:
      status: accepted
      catalog_status: mapped_official_bms_xpath
      confidence: high
      review_required: false
      source: mapping_catalog v0.3 (webvoc validated)
      notes: Measurement value is element text; unit via BMS 1735 quantityContained/@measurementUnitCode.
        | Generic gs1:nutrientDetail, gs1:nutrientTypeCode and gs1:quantityContained are not
        present in the supplied Web Vocabulary. Current v0.2 mapping should be treated as
        experimental.
      review_action: model_review
  - id: quantity_unit
    xpath: ./*[local-name()='quantityContained']/*[local-name()='measurementUnitCode']
    value_xpath: text()
    canonical_field: quantity_contained.unit_code
    jsonld_property: gs1:quantityContained.unitCode
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
    governance:
      status: accepted
      catalog_status: mapped_official_bms_xpath
      confidence: high
      review_required: false
      source: mapping_catalog v0.3 (webvoc validated)
      notes: Measurement value is element text; unit via BMS 1735 quantityContained/@measurementUnitCode.
