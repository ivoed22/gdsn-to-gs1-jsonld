    governance:
      status: accepted
      catalog_status: candidate_official_bms_xpath
      confidence: medium
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: General referenced file detail module; useful for DPP-like document links if
        code list supports DPP/related document type. | Schema.org term; not part of GS1 Web
        Vocabulary but acceptable as an external namespace if documented.
      review_action: OK_schema
  - id: document_file_format
    xpath: ./*[local-name()='fileFormatName']
    value_xpath: text()
