  parent_xpath: .//*[local-name()='certificationInformation']/*[local-name()='certification']
  canonical_field: certifications
  jsonld_property: gs1:certification
  object_type: gs1:CertificationDetails
  multiple: true
  fields:
  - id: certification_standard
    xpath: ancestor::*[local-name()='certificationInformation'][1]/*[local-name()='certificationStandard']
    value_xpath: text()
    canonical_field: certification_standard
    jsonld_property: gs1:certificationStandard
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    - normalize_whitespace
    governance:
      status: accepted
      catalog_status: candidate_official_bms_xpath
      confidence: high
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: 'BMS definition: name of certification standard or type of certification.'
      review_action: OK
  - id: certification_identification
    xpath: ./*[local-name()='certificationIdentification']
    value_xpath: text()
    canonical_field: certification_identification
    jsonld_property: schema:identifier
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    governance:
      status: accepted
      catalog_status: needs_semantic_review
      confidence: medium
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: BMS certificationIdentification is a reference issued to confirm certification.
        Decide if maps to certificationValue or certificationURI depending on content.
      review_action: OK
  - id: certification_value
    xpath: ./*[local-name()='certificationValue']
    value_xpath: text()
    canonical_field: certification_value
    jsonld_property: gs1:certificationValue
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - normalize_whitespace
    governance:
      status: accepted
      catalog_status: candidate_official_bms_xpath
      confidence: high
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: 'BMS definition: unique identification / official licensing number / certification
        value.'
      review_action: OK
  - id: certificate_issuance_date_time
    xpath: ./*[local-name()='certificateIssuanceDateTime']
    value_xpath: text()
    canonical_field: certificate_issuance_date_time
    jsonld_property: schema:dateIssued
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    governance:
      status: accepted
      catalog_status: null
      confidence: null
      review_required: true
      source: mapping_v0_3.yaml (no catalog row; experimental alignment)
  - id: certification_assessment_date_time
    xpath: ./*[local-name()='certificationAssessmentDateTime']
    value_xpath: text()
    canonical_field: assessment_date
    jsonld_property: gs1:certificationAuditDate
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    - to_date
    governance:
      status: accepted
      catalog_status: candidate_official_bms_xpath
      confidence: medium
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: certificationAssessmentDateTime appears closer to audit/assessment date.
      review_action: OK
  - id: certification_effective_start_date_time
    xpath: ./*[local-name()='certificationEffectiveStartDateTime']
    value_xpath: text()
    canonical_field: effective_start
    jsonld_property: gs1:certificationStartDate
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    - to_date
    governance:
      status: accepted
      catalog_status: needs_web_vocab_review
      confidence: medium
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: Check GS1 Web Vocabulary target property for start/effective start date before
        implementation. | gs1:certificationStartDate exists; gs1:certificationEffectiveStartDate
        does not.
      review_action: review_select
  - id: certification_effective_end_date_time
    xpath: ./*[local-name()='certificationEffectiveEndDateTime']
    value_xpath: text()
    canonical_field: effective_end
    jsonld_property: gs1:certificationEndDate
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    - to_date
    governance:
      status: accepted
      catalog_status: candidate_official_bms_xpath
      confidence: high
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: certificationEffectiveEndDateTime maps well to certification end/effective end.
      review_action: OK
  - id: certification_organisation_identifier
    xpath: ancestor::*[local-name()='certificationInformation'][1]/*[local-name()='certificationOrganisationIdentifier']
    value_xpath: text()
    canonical_field: certification_organisation_identifier
    jsonld_property: gs1:certificationAgency
    datatype: string
    required: false
    multiple: false
    transform:
    - trim
    governance:
      status: accepted
      catalog_status: needs_semantic_review
      confidence: medium
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: This is a GLN for issuing organization, not a URL. JSON-LD target should not
        be certificationAgencyURL without transformation.
      review_action: OK
  governance:
    status: accepted
    catalog_status: candidate
    confidence: medium
    review_required: true
    source: mapping_catalog v0.3 (webvoc validated)
    notes: Certification class container. Use fields below for actual values.
    review_action: OK
- id: referenced_documents
