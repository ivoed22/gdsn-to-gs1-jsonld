      confidence: medium
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: General file format name. | Schema.org term; not part of GS1 Web Vocabulary but
        acceptable as an external namespace if documented.
      review_action: OK_schema
  - id: document_file_type
    xpath: ./*[local-name()='referencedFileTypeCode']
    value_xpath: text()
    canonical_field: referenced_file_type
    jsonld_property: schema:additionalType
    datatype: string
    required: true
    multiple: false
    transform:
    - trim
    - uppercase
    governance:
      status: accepted
      catalog_status: candidate_official_bms_xpath
      confidence: medium
      review_required: true
      source: mapping_catalog v0.3 (webvoc validated)
      notes: General referenced file type code; requires code-list review for DPP_DOCUMENT
        / CERTIFICATION_DOCUMENT. | No gs1:referencedFileTypeCode property found. Web Vocabulary
        contains code values such as gs1:ReferencedFileTypeCode-* but not this property.
      review_action: model_review
  - id: document_url
    xpath: ./*[local-name()='uniformResourceIdentifier']
    value_xpath: text()
    canonical_field: document_url
    jsonld_property: schema:url
    datatype: url
    required: true
